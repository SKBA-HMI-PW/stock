name: Daily volume scanner

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 23:00 UTC. That is 7 PM ET during daylight time and 6 PM ET during standard time.
    - cron: "0 23 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/results.csv
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Update scanner results"
            git push
          fi
